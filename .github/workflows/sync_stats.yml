name: Sincronizar Estatisticas Gamers Club

on:
  schedule:
    # Executa a cada 6 horas automaticamente
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar config.json a partir dos Secrets
        env:
          GC_CONFIG: ${{ secrets.GC_CONFIG }}
        run: |
          if [ -n "$GC_CONFIG" ]; then
            echo "$GC_CONFIG" > config.json
          else
            echo "Secrets GC_CONFIG não configurado. Pulando atualização."
            exit 0
          fi

      - name: Sincronizar Jogos Recentes
        run: python sync_now.py

      - name: Commit e Push do Banco Atualizado
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sync"
          git add gc_stats.db
          if git diff-index --quiet HEAD --; then
            echo "Nenhuma partida nova para commitar."
          else
            git commit -m "chore: auto-update gc_stats.db [skip ci]"
            git push origin main
          fi
